<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiB — Browser inside Browser</title>
    <meta name="description" content="A miniature desktop web browser simulation built completely client-side using HTML5, CSS3, and vanilla JavaScript.">
    <meta name="theme-color" content="#171b26">

    <!-- OpenGraph Metadata -->
    <meta property="og:title" content="BiB — Browser inside Browser">
    <meta property="og:description" content="A mini web browser simulation living inside your browser. No frameworks, no build step, pure front-end craftsmanship.">
    <meta property="og:type" content="website">

    <!-- Google Fonts for sleek modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets (Relative paths for GitHub Pages compatibility) -->
    <link rel="stylesheet" href="./css/themes.css">
    <link rel="stylesheet" href="./css/animations.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/responsive.css">

    <!-- Inline SVG Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><rect x='20' y='20' width='60' height='60' rx='10' fill='%23171b26'/><circle cx='34' cy='34' r='4' fill='%23ff5f56'/><circle cx='46' cy='34' r='4' fill='%23ffbd2e'/><circle cx='58' cy='34' r='4' fill='%2327c93f'/></svg>">
</head>
<body>

    <!-- Desktop Workspace Canvas -->
    <div class="desktop-workspace">

        <!-- Restore Pill (visible when BiB is minimized) -->
        <div class="desktop-restore-bar" id="restoreBar" title="Click to restore BiB Window">
            <span class="restore-icon">🌀</span>
            <span class="restore-text">Restore BiB Window</span>
        </div>

        <!-- Main Browser Window Shell -->
        <main class="browser-window" role="application" aria-label="BiB Browser">

            <!-- Playful Close Refusal Notice -->
            <div class="window-notice" id="windowNotice">
                <span>🛡️</span>
                <span>Nice try 😄 BiB refuses to close itself.</span>
            </div>

            <!-- Top Titlebar & Tab Bar -->
            <header class="window-titlebar">
                <!-- macOS Window Controls (Traffic Lights) -->
                <div class="window-controls">
                    <button class="control-btn close" aria-label="Close window" title="Close BiB">
                        <svg width="6" height="6" viewBox="0 0 10 10" fill="currentColor"><path d="M1 1L9 9M9 1L1 9" stroke="currentColor" stroke-width="2"/></svg>
                    </button>
                    <button class="control-btn minimize" aria-label="Minimize window" title="Minimize BiB">
                        <svg width="6" height="6" viewBox="0 0 10 10" fill="currentColor"><line x1="1" y1="5" x2="9" y2="5" stroke="currentColor" stroke-width="2"/></svg>
                    </button>
                    <button class="control-btn maximize" aria-label="Maximize window" title="Toggle Maximize">
                        <svg width="6" height="6" viewBox="0 0 10 10" fill="currentColor"><path d="M1 9L9 1M9 1H4M9 1V6" stroke="currentColor" stroke-width="2"/></svg>
                    </button>
                </div>

                <!-- Tabs Wrapper -->
                <div class="tabs-wrapper">
                    <div class="tabs-container" role="tablist">
                        <!-- Rendered dynamically by TabManager -->
                    </div>
                    <button class="new-tab-btn" aria-label="New tab" title="New Tab (Ctrl+T)">＋</button>
                </div>

                <!-- Right Titlebar Branding -->
                <div class="titlebar-badge">
                    <span class="logo-dot"></span>
                    <span>BiB Quantum</span>
                </div>
            </header>

            <!-- Navigation Toolbar -->
            <section class="toolbar">
                <!-- Navigation Actions -->
                <div class="nav-actions">
                    <button class="toolbar-btn btn-back" aria-label="Back" title="Back (Alt+←)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    </button>
                    <button class="toolbar-btn btn-forward" aria-label="Forward" title="Forward (Alt+→)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </button>
                    <button class="toolbar-btn btn-reload" aria-label="Reload" title="Reload (Ctrl+R)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                    </button>
                    <button class="toolbar-btn btn-home" aria-label="Home" title="Home Page">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    </button>
                </div>

                <!-- Omnibox (Address & Search Bar) -->
                <div class="omnibox-wrapper">
                    <div class="omnibox">
                        <div class="security-badge" title="Connection is simulated and completely secure">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                            <span>Secure</span>
                        </div>
                        <input type="text" class="url-input" placeholder="Search BiB or enter address..." spellcheck="false" autocomplete="off" aria-label="Address bar">
                        <button class="star-btn" aria-label="Bookmark page" title="Bookmark page (Ctrl+D)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                        </button>
                    </div>

                    <!-- Autocomplete Suggestions Dropdown -->
                    <div class="omnibox-dropdown"></div>
                </div>

                <!-- Extensions & Right Toolbar Controls -->
                <div class="toolbar-extensions">
                    <button class="toolbar-btn theme-toggle-btn" aria-label="Switch theme" title="Cycle Theme">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    </button>
                    <button class="toolbar-btn devtools-btn" aria-label="Open DevTools" title="Developer Tools (bib://developer)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                    </button>
                    <button class="toolbar-btn downloads-btn" aria-label="Downloads" title="Downloads Manager (bib://downloads)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    </button>
                    <button class="toolbar-btn menu-btn" aria-label="Main menu" title="Customize and control BiB">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                    </button>
                </div>
            </section>

            <!-- Bookmark Bar -->
            <nav class="bookmark-bar" aria-label="Bookmarks bar">
                <!-- Populated dynamically by BookmarksManager -->
            </nav>

            <!-- Web Viewport -->
            <section class="viewport">
                <!-- Top Loading Progress Bar -->
                <div class="progress-container">
                    <div class="progress-bar"></div>
                </div>

                <!-- Page Container (Active tab content) -->
                <div class="page-container" tabindex="0">
                    <!-- Dynamic page rendering will occur here -->
                </div>
            </section>

            <!-- Status Bar -->
            <footer class="status-bar">
                <div class="status-left">
                    <div class="status-badge">
                        <span class="status-dot"></span>
                        <span>Secure • BiB Simulation</span>
                    </div>
                    <span class="status-link-hover"></span>
                </div>
                <div class="status-right">
                    <span class="status-ram">RAM: 42 MB</span>
                    <span class="status-zoom">100%</span>
                    <span class="status-tabs-count">Tab 1 of 3</span>
                </div>
            </footer>

            <!-- Browser Dropdown Menu -->
            <div class="browser-menu">
                <button class="menu-item" data-menu-action="new-tab">
                    <span class="menu-left"><span>＋</span> New Tab</span>
                    <span class="shortcut">Ctrl+T</span>
                </button>
                <button class="menu-item" data-menu-action="new-window">
                    <span class="menu-left"><span>🪟</span> New Window</span>
                    <span class="shortcut">Ctrl+N</span>
                </button>
                <button class="menu-item" data-menu-action="reopen-tab">
                    <span class="menu-left"><span>🗂️</span> Reopen Closed Tab</span>
                    <span class="shortcut">Ctrl+Shift+T</span>
                </button>
                <div class="menu-divider"></div>
                <button class="menu-item" data-menu-action="history">
                    <span class="menu-left"><span>📜</span> History</span>
                    <span class="shortcut">Ctrl+H</span>
                </button>
                <button class="menu-item" data-menu-action="bookmarks">
                    <span class="menu-left"><span>⭐</span> Bookmarks</span>
                    <span class="shortcut">Ctrl+B</span>
                </button>
                <button class="menu-item" data-menu-action="downloads">
                    <span class="menu-left"><span>📥</span> Downloads</span>
                    <span class="shortcut">Ctrl+J</span>
                </button>
                <button class="menu-item" data-menu-action="games">
                    <span class="menu-left"><span>🎮</span> Arcade Games</span>
                </button>
                <div class="menu-divider"></div>
                <div class="menu-item zoom-controls">
                    <span class="menu-left"><span>🔍</span> Zoom</span>
                    <div style="display:flex;align-items:center;gap:6px;">
                        <button class="zoom-btn" id="zoomOutBtn" title="Zoom Out">−</button>
                        <span id="menuZoomVal" style="font-size:11px;min-width:32px;text-align:center;">100%</span>
                        <button class="zoom-btn" id="zoomInBtn" title="Zoom In">＋</button>
                        <button class="zoom-btn" id="zoomResetBtn" style="font-size:10px;padding:0 4px;" title="Reset Zoom">100%</button>
                    </div>
                </div>
                <button class="menu-item" data-menu-action="print">
                    <span class="menu-left"><span>🖨️</span> Print</span>
                    <span class="shortcut">Ctrl+P</span>
                </button>
                <button class="menu-item" data-menu-action="view-source">
                    <span class="menu-left"><span>📄</span> View Source</span>
                    <span class="shortcut">Ctrl+U</span>
                </button>
                <button class="menu-item" data-menu-action="devtools">
                    <span class="menu-left"><span>⚡</span> Developer Tools</span>
                    <span class="shortcut">F12</span>
                </button>
                <div class="menu-divider"></div>
                <div class="menu-item has-submenu">
                    <span class="menu-left"><span>🎨</span> Appearance & Theme</span>
                    <span>›</span>
                    <div class="submenu-popover">
                        <button class="menu-item" data-theme-option="dark"><span>● Dark Slate</span></button>
                        <button class="menu-item" data-theme-option="light"><span>○ Clean Light</span></button>
                        <button class="menu-item" data-theme-option="midnight"><span>○ Deep Midnight</span></button>
                        <button class="menu-item" data-theme-option="cyber"><span>○ Cyber Neon</span></button>
                    </div>
                </div>
                <button class="menu-item" data-menu-action="settings">
                    <span class="menu-left"><span>⚙️</span> Settings</span>
                </button>
                <button class="menu-item" data-menu-action="about">
                    <span class="menu-left"><span>ℹ️</span> About BiB</span>
                </button>
            </div>
        </main>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" aria-live="polite"></div>

    <!-- Generic Modal Dialog Backdrop -->
    <div class="modal-backdrop" role="dialog" aria-modal="true">
        <div class="modal-card modal-content-in">
            <div class="modal-header">
                <h3 class="modal-title">BiB Dialog</h3>
                <button class="modal-close-btn" aria-label="Close dialog">✕</button>
            </div>
            <div class="modal-body"></div>
            <div class="modal-footer"></div>
        </div>
    </div>

    <!-- Vanilla JavaScript Modules in dependency order -->
    <script src="./js/storage.js"></script>
    <script src="./js/notifications.js"></script>
    <script src="./js/themes.js"></script>
    <script src="./js/keyboard.js"></script>
    <script src="./js/context-menu.js"></script>
    <script src="./js/bookmarks.js"></script>
    <script src="./js/history.js"></script>
    <script src="./js/search.js"></script>
    <script src="./js/games.js"></script>
    <script src="./js/navigation.js"></script>
    <script src="./js/tabs.js"></script>
    <script src="./js/browser.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
