<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiB — Browser inside Browser</title>
    <meta name="description" content="A miniature desktop web browser simulation built completely client-side using HTML5, CSS3, and vanilla JavaScript.">
    <meta name="theme-color" content="#FFFFFF">

    <!-- PWA Manifest & Meta -->
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="BiB">

    <!-- OpenGraph Metadata -->
    <meta property="og:title" content="BiB — Browser inside Browser">
    <meta property="og:description" content="A tiny browser simulation living inside your browser. Handcrafted with Apple-level design quality.">
    <meta property="og:type" content="website">

    <!-- Auto-purge stale SW cache on reload -->
    <script>
        (function() {
            if ('caches' in window) {
                caches.keys().then(keys => {
                    for (let key of keys) {
                        if (key === 'bib-v2-cache-v1') {
                            caches.delete(key).then(() => console.log('[BiB] Purged stale v1 cache'));
                        }
                    }
                });
            }
            if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(regs => {
                        for (let reg of regs) {
                            reg.update();
                        }
                    });
                }
            }
        })();
    </script>

    <!-- Stylesheets (Tokens, Base, Components, Chrome, Pages, Animations, Themes, Responsive) -->
    <link rel="stylesheet" href="./css/tokens.css?v=2.0.2">
    <link rel="stylesheet" href="./css/base.css?v=2.0.2">
    <link rel="stylesheet" href="./css/components.css?v=2.0.2">
    <link rel="stylesheet" href="./css/browser.css?v=2.0.2">
    <link rel="stylesheet" href="./css/pages.css?v=2.0.2">
    <link rel="stylesheet" href="./css/animations.css?v=2.0.2">
    <link rel="stylesheet" href="./css/themes.css?v=2.0.2">
    <link rel="stylesheet" href="./css/responsive.css?v=2.0.2">

    <!-- Inline SVG Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23F5F5F7'/><rect x='15' y='15' width='70' height='70' rx='14' fill='%23FFFFFF' stroke='%230071E3' stroke-width='4'/><circle cx='30' cy='30' r='3.5' fill='%23FF5F57'/><circle cx='40' cy='30' r='3.5' fill='%23FEBC2E'/><circle cx='50' cy='30' r='3.5' fill='%2328C840'/></svg>">
</head>
<body>

    <!-- Desktop Workspace -->
    <div class="desktop-workspace">

        <!-- Minimized Floating Dock Pill -->
        <div class="desktop-restore-dock" id="restoreDock" title="Click to restore BiB window">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="14" height="14" rx="3"/><path d="M7 3v14"/></svg>
            <span>Restore BiB</span>
        </div>

        <!-- Main Browser Window -->
        <main class="browser-window" role="application" aria-label="BiB Browser">

            <!-- Playful Close Refusal Notice -->
            <div class="close-refusal-toast">
                <span>Nice try 😄 BiB refuses to close itself.</span>
            </div>

            <!-- Top Header (Traffic Lights + Tab Bar) -->
            <header class="window-header">
                <!-- macOS Traffic Lights -->
                <div class="traffic-lights">
                    <button class="traffic-dot close" aria-label="Close window" title="Close window">
                        <svg width="6" height="6" viewBox="0 0 10 10"><path d="M1 1L9 9M9 1L1 9" stroke-width="2"/></svg>
                    </button>
                    <button class="traffic-dot minimize" aria-label="Minimize window" title="Minimize window">
                        <svg width="6" height="6" viewBox="0 0 10 10"><line x1="1" y1="5" x2="9" y2="5" stroke-width="2"/></svg>
                    </button>
                    <button class="traffic-dot maximize" aria-label="Maximize window" title="Toggle maximize">
                        <svg width="6" height="6" viewBox="0 0 10 10"><path d="M1 9L9 1M9 1H4M9 1V6" stroke-width="2"/></svg>
                    </button>
                </div>

                <!-- Tabs Container (Dynamic tabs + HTML5 Drag & Drop) -->
                <div class="tab-bar-container" role="tablist"></div>

                <!-- New Tab Button -->
                <button class="new-tab-btn" aria-label="New tab" title="New Tab (⌘T)">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M10 4V16M4 10H16"/></svg>
                </button>
            </header>

            <!-- Navigation Toolbar -->
            <section class="window-toolbar">
                <!-- Left Nav Buttons -->
                <div class="toolbar-nav-group">
                    <button class="btn-icon btn-back" aria-label="Back" title="Back (Alt+←)">
                        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12.5 15L7.5 10L12.5 5"/></svg>
                    </button>
                    <button class="btn-icon btn-forward" aria-label="Forward" title="Forward (Alt+→)">
                        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M7.5 15L12.5 10L7.5 5"/></svg>
                    </button>
                    <button class="btn-icon btn-reload" aria-label="Reload" title="Reload (⌘R)">
                        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M16.5 4V8H12.5"/><path d="M3.5 16V12H7.5"/><path d="M5.5 8A6 6 0 0 1 15.5 6.5L16.5 8"/><path d="M14.5 12A6 6 0 0 1 4.5 13.5L3.5 12"/></svg>
                    </button>
                </div>

                <!-- Centered Omnibox -->
                <div class="omnibox-wrapper">
                    <div class="omnibox">
                        <div class="security-badge" title="Connection is simulated and completely secure">
                            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="4.5" y="8.5" width="11" height="8.5" rx="2"/><path d="M7 8.5V6C7 4.3 8.3 3 10 3C11.7 3 13 4.3 13 6V8.5"/></svg>
                        </div>
                        <input type="text" class="url-input" placeholder="Search or enter website" spellcheck="false" autocomplete="off" aria-label="Address bar">
                        
                        <div class="omnibox-actions">
                            <button class="btn-icon reader-btn" aria-label="Reader Mode" title="Toggle Reader Mode">
                                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75"><line x1="4" y1="5.5" x2="16" y2="5.5"/><line x1="4" y1="9.5" x2="16" y2="9.5"/><line x1="4" y1="13.5" x2="11" y2="13.5"/></svg>
                            </button>
                            <button class="btn-icon star-btn" aria-label="Bookmark page" title="Bookmark Page (⌘D)">
                                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75"><polygon points="10 2.5 12.3 7.3 17.5 8 13.7 11.7 14.6 17 10 14.5 5.4 17 6.3 11.7 2.5 8 7.7 7.3 10 2.5"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Autocomplete Dropdown -->
                    <div class="omnibox-dropdown"></div>
                </div>

                <!-- Right Toolbar Actions -->
                <div class="toolbar-nav-group">
                    <button class="btn-icon share-btn" aria-label="Share page" title="Share Page">
                        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="15" cy="5" r="2.5"/><circle cx="5" cy="10" r="2.5"/><circle cx="15" cy="15" r="2.5"/><line x1="7.2" y1="8.9" x2="12.8" y2="6.1"/><line x1="7.2" y1="11.1" x2="12.8" y2="13.9"/></svg>
                    </button>
                    <button class="btn-icon menu-btn" aria-label="Main menu" title="More options">
                        <svg viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="10" r="1.5"/><circle cx="5" cy="10" r="1.5"/><circle cx="15" cy="10" r="1.5"/></svg>
                    </button>
                </div>
            </section>

            <!-- Bookmark Bar -->
            <nav class="bookmark-bar" aria-label="Bookmarks bar"></nav>

            <!-- Find In Page Bar (Ctrl/Cmd + F) -->
            <div class="find-bar">
                <input type="text" class="find-input" placeholder="Find on page..." aria-label="Find on page">
                <span class="find-count">0/0</span>
                <button class="btn-icon find-prev" aria-label="Previous match" title="Previous match">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75"><polyline points="5 12.5 10 7.5 15 12.5"/></svg>
                </button>
                <button class="btn-icon find-next" aria-label="Next match" title="Next match">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75"><polyline points="5 7.5 10 12.5 15 7.5"/></svg>
                </button>
                <button class="btn-icon find-close" aria-label="Close find bar">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M14 6L6 14M6 6L14 14"/></svg>
                </button>
            </div>

            <!-- Viewport Area -->
            <section class="viewport">
                <!-- Progress Line -->
                <div class="progress-container">
                    <div class="progress-bar"></div>
                </div>

                <!-- Active Page Container -->
                <div class="page-container" tabindex="0"></div>
            </section>

            <!-- Status Bar -->
            <footer class="window-status">
                <div class="status-left">
                    <div class="status-network-pill">
                        <span class="status-dot"></span>
                        <span class="status-net-text">Online</span>
                    </div>
                    <span class="status-clock">9:42 PM</span>
                </div>
                <div class="status-right">
                    <span class="status-battery"></span>
                    <span class="status-zoom">100%</span>
                    <span class="status-tabs-count">Tab 1 of 3</span>
                </div>
            </footer>

            <!-- Mobile Bottom Bar (iOS Safari Style) -->
            <nav class="mobile-bottom-nav">
                <button class="mobile-nav-btn" id="mobileNavHome">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 9l7-6 7 6v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>
                    <span>Home</span>
                </button>
                <button class="mobile-nav-btn" id="mobileNavTabs">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="14" height="14" rx="3"/><path d="M10 3v14"/></svg>
                    <span>Tabs</span>
                </button>
                <button class="mobile-nav-btn" id="mobileNavBm">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75"><polygon points="10 2.5 12.3 7.3 17.5 8 13.7 11.7 14.6 17 10 14.5 5.4 17 6.3 11.7 2.5 8 7.7 7.3 10 2.5"/></svg>
                    <span>Bookmarks</span>
                </button>
                <button class="mobile-nav-btn" id="mobileNavMenu">
                    <svg viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="10" r="1.5"/><circle cx="5" cy="10" r="1.5"/><circle cx="15" cy="10" r="1.5"/></svg>
                    <span>Menu</span>
                </button>
            </nav>

            <!-- Dropdown Menu -->
            <div class="dropdown-menu">
                <button class="menu-item" data-menu-action="new-tab">
                    <span class="menu-left">New Tab</span>
                    <span class="menu-shortcut">⌘T</span>
                </button>
                <button class="menu-item" data-menu-action="reopen-tab">
                    <span class="menu-left">Reopen Closed Tab</span>
                    <span class="menu-shortcut">⌘⇧T</span>
                </button>
                <button class="menu-item" data-menu-action="find">
                    <span class="menu-left">Find on Page</span>
                    <span class="menu-shortcut">⌘F</span>
                </button>
                <div class="menu-divider"></div>
                <button class="menu-item" data-menu-action="history">
                    <span class="menu-left">History</span>
                </button>
                <button class="menu-item" data-menu-action="bookmarks">
                    <span class="menu-left">Bookmarks</span>
                </button>
                <button class="menu-item" data-menu-action="downloads">
                    <span class="menu-left">Downloads</span>
                </button>
                <button class="menu-item" data-menu-action="devtools">
                    <span class="menu-left">Developer Tools</span>
                </button>
                <button class="menu-item" data-menu-action="settings">
                    <span class="menu-left">Settings</span>
                </button>
                <div class="menu-divider"></div>
                <button class="menu-item" data-menu-action="fullscreen">
                    <span class="menu-left">Enter Fullscreen</span>
                </button>
                <button class="menu-item" data-menu-action="print">
                    <span class="menu-left">Print...</span>
                    <span class="menu-shortcut">⌘P</span>
                </button>
                <button class="menu-item" data-menu-action="focus-mode">
                    <span class="menu-left">Focus Mode</span>
                </button>
                <button class="menu-item" data-menu-action="toggle-theme">
                    <span class="menu-left">Toggle Dark / Light</span>
                </button>
            </div>
        </main>
    </div>

    <!-- Tab Hover Preview Popover -->
    <div class="tab-hover-preview">
        <div class="tab-preview-title">Page Title</div>
        <div class="tab-preview-url">bib://home</div>
        <div class="tab-preview-thumb">Tab Snapshot</div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" aria-live="polite"></div>

    <!-- Modal Dialog Backdrop -->
    <div class="modal-backdrop" role="dialog" aria-modal="true">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3 class="modal-title">Dialog</h3>
                <button class="btn-icon modal-close-btn" onclick="document.querySelector('.modal-backdrop').classList.remove('is-open')" aria-label="Close dialog">
                    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M14 6L6 14M6 6L14 14"/></svg>
                </button>
            </div>
            <div class="modal-body"></div>
            <div class="modal-footer"></div>
        </div>
    </div>

    <!-- Vanilla JS Modules (Strict mode, modular dependency order) -->
    <script src="./js/utils.js?v=2.0.2"></script>
    <script src="./js/storage.js?v=2.0.2"></script>
    <script src="./js/indexeddb.js?v=2.0.2"></script>
    <script src="./js/notifications.js?v=2.0.2"></script>
    <script src="./js/themes.js?v=2.0.2"></script>
    <script src="./js/fullscreen.js?v=2.0.2"></script>
    <script src="./js/share.js?v=2.0.2"></script>
    <script src="./js/downloads.js?v=2.0.2"></script>
    <script src="./js/history.js?v=2.0.2"></script>
    <script src="./js/bookmarks.js?v=2.0.2"></script>
    <script src="./js/search.js?v=2.0.2"></script>
    <script src="./js/settings.js?v=2.0.2"></script>
    <script src="./js/keyboard.js?v=2.0.2"></script>
    <script src="./js/context-menu.js?v=2.0.2"></script>
    <script src="./js/games.js?v=2.0.2"></script>
    <script src="./js/developer-tools.js?v=2.0.2"></script>
    <script src="./js/renderer.js?v=2.0.2"></script>
    <script src="./js/tabs.js?v=2.0.2"></script>
    <script src="./js/navigation.js?v=2.0.2"></script>
    <script src="./js/browser.js?v=2.0.2"></script>
    <script src="./js/app.js?v=2.0.2"></script>
</body>
</html>
